[project]
name = "learning-os"
version = "0.1.0"
description = "A local-first system that turns papers and notes into a structured account of what you know, then uses it to decide what to learn and what to build next."
readme = "README.md"
license = "MIT"
authors = [{name = "akshatagar"}]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.5",
    "chromadb>=1.5.9",
    "docling>=2.113.0",
    "fastapi>=0.139.2",
    "httpx>=0.28.1",
    "langgraph>=1.2.9",
    "ollama>=0.6.2",
    "python-dotenv>=1.2.2",
    "pywebview>=6.2.1",
    "sentence-transformers>=5.6.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "live: makes a real Ollama or Tavily call; excluded from CI (pytest -m \"not live\")",
]
