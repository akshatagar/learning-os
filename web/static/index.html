<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learning-os</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="plate">
  <!-- The name is the way home: it closes whatever surface is open. -->
  <button id="home" class="plate__name" type="button"
          aria-label="LEARNING-OS, back to the whole panel">LEARNING-OS</button>
  <!-- Reel Inbox: every stored reel, newest first. -->
  <div class="plate__controls">
    <button id="inbox-open" class="gate__button inbox__open" type="button"
            data-surface="inbox" aria-label="Inbox">
      INBOX <span id="inbox-count"></span>
    </button>
  </div>
  <span class="plate__state" id="plant-state">READING PANEL</span>
</header>

<main>
<p class="fault" id="fault" hidden></p>

<svg id="panel" viewBox="0 0 790 360" role="group"
     aria-label="Pipeline mimic panel">
  <!-- Two rows rather than one: an eight-stage single row is so wide that the
       drawing could never be drawn larger than 1:1, which left 11px labels
       and an empty lower window. Folded, it fits the window both ways. -->
  <g class="runs" fill="none" stroke="var(--line)" stroke-width="1.5">
    <path d="M150 73 H190"/>
    <path d="M300 73 H340"/>
    <path d="M450 73 H490"/>
    <path d="M600 73 H695 V110"/>
    <path d="M545 96 V160 H95 V190"/>
    <path d="M150 233 H190"/>
    <path d="M300 233 H340"/>
    <path d="M450 233 H490"/>
    <path d="M640 313 H395 V256" class="run--input"/>
  </g>

  <g class="stages">
    <g class="stage" data-stage="ingest"     transform="translate(40,50)"></g>
    <g class="stage" data-stage="resolution" transform="translate(190,50)"></g>
    <g class="stage" data-stage="queue"      transform="translate(340,50)"></g>
    <g class="stage" data-stage="concepts"   transform="translate(490,50)"></g>
    <g class="stage" data-stage="goals"      transform="translate(640,130)"></g>
    <g class="stage" data-stage="ideas"      transform="translate(40,210)"></g>
    <g class="stage" data-stage="approval"   transform="translate(190,210)"></g>
    <g class="stage" data-stage="scoring"    transform="translate(340,210)"></g>
    <g class="stage" data-stage="planning"   transform="translate(490,210)"></g>
    <g class="stage" data-stage="skills"     transform="translate(640,290)"></g>
  </g>
</svg>

<div class="work">
<svg id="panel-narrow" viewBox="0 0 320 640" role="group"
     aria-label="Pipeline mimic panel, vertical">
  <g class="runs" fill="none" stroke="var(--line)" stroke-width="1.5">
    <path d="M95 46 V62"/>
    <path d="M95 128 V144"/>
    <path d="M95 210 V226"/>
    <path d="M95 292 V308"/>
    <path d="M95 374 V390"/>
    <path d="M95 456 V472"/>
    <path d="M95 538 V554"/>
    <path d="M150 269 H190"/>
    <path d="M190 515 H150" class="run--input"/>
  </g>
  <g class="stages">
    <g class="stage" data-stage="ingest"     transform="translate(40,0)"></g>
    <g class="stage" data-stage="resolution" transform="translate(40,82)"></g>
    <g class="stage" data-stage="queue"      transform="translate(40,164)"></g>
    <g class="stage" data-stage="concepts"   transform="translate(40,246)"></g>
    <g class="stage" data-stage="goals"      transform="translate(190,246)"></g>
    <g class="stage" data-stage="ideas"      transform="translate(40,328)"></g>
    <g class="stage" data-stage="approval"   transform="translate(40,410)"></g>
    <g class="stage" data-stage="scoring"    transform="translate(40,492)"></g>
    <g class="stage" data-stage="skills"     transform="translate(190,492)"></g>
    <g class="stage" data-stage="planning"   transform="translate(40,574)"></g>
  </g>
</svg>

<section id="surface" class="surface" hidden>
  <header class="surface__plate">
    <span id="surface-title">STAGE</span>
    <span id="surface-count"></span>
    <button id="surface-close" class="surface__close" type="button">CLOSE</button>
  </header>
  <div id="surface-body"></div>
</section>
</div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
